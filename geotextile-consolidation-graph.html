<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geotextile Consolidation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c0e;color:#d4d8db;font-family:'Inter',sans-serif;display:flex;justify-content:center}
.wrap{width:540px;padding:12px}
h1{font-size:13px;font-weight:700;letter-spacing:-.02em;margin-bottom:1px}
h1 span{color:#4a9eff}
.s{font-size:8px;color:#3a4248;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.l{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap;font-size:7px;color:#3a4248;letter-spacing:.05em}
.l span{display:flex;align-items:center;gap:3px}
.l .d{width:6px;height:6px;border-radius:50%;display:inline-block;vertical-align:middle}
svg{width:100%;height:auto}
.f{text-align:center;font-size:7px;color:#1a2024;border-top:1px solid #14181c;margin-top:2px;padding:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>GEOTEXTILE <span>CONSOLIDATION</span></h1>
<div class="s">North America · 1861–2026 · Flow top → bottom</div>
<div class="l">
  <span><span class="d" style="background:#4a9eff"></span>Solmax</span>
  <span><span class="d" style="background:#e0a030"></span>CMC/Tensar</span>
  <span><span class="d" style="background:#30b880"></span>Maccaferri</span>
  <span><span class="d" style="background:#d04060"></span>Thrace</span>
  <span><span class="d" style="background:#68747e"></span>Independent</span>
</div>

<svg viewBox="0 0 540 780" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif">

  <!-- spines -->
  <g stroke="opacity:.06" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="620" stroke="#4a9eff"/>
    <line x1="210" y1="40" x2="210" y2="620" stroke="#e0a030"/>
    <line x1="340" y1="40" x2="340" y2="620" stroke="#30b880"/>
    <line x1="470" y1="40" x2="470" y2="620" stroke="#d04060"/>
  </g>

  <!-- ════ SOLMAX ════ -->
  <g fill="#4a9eff">
    <path d="M80,100 L80,140" stroke="#4a9eff" stroke-width="1" fill="none" opacity=".25"/>
    <circle cx="80" cy="100" r="5" opacity=".35"/>
    <text x="92" y="103" font-size="9" font-weight="500">TenCate</text>
    <text x="160" y="103" font-size="6" fill="#2a4058" font-weight="400">1704</text>

    <path d="M80,200 L80,260" stroke="#4a9eff" stroke-width="1" fill="none" opacity=".25"/>
    <circle cx="80" cy="200" r="6" opacity=".4"/>
    <text x="92" y="203" font-size="9" font-weight="500">Amoco Fabrics</text>
    <text x="210" y="203" font-size="6" fill="#2a4058" font-weight="400">~1970</text>

    <circle cx="80" cy="260" r="7" opacity=".5"/>
    <text x="92" y="263" font-size="9" font-weight="500">GSE</text>
    <text x="140" y="263" font-size="6" fill="#2a4058" font-weight="400">1972</text>

    <path d="M80,340 L80,400" stroke="#4a9eff" stroke-width="1" fill="none" opacity=".2"/>
    <circle cx="80" cy="340" r="6" opacity=".45"/>
    <text x="92" y="343" font-size="9" font-weight="500">Propex</text>
    <text x="155" y="343" font-size="6" fill="#2a4058" font-weight="400">2004</text>

    <circle cx="130" cy="400" r="4" opacity=".3"/>
    <text x="140" y="403" font-size="7">SI Corp</text>
    <path d="M80,400 L130,400" stroke="#4a9eff" stroke-width="1" fill="none" opacity=".2"/>

    <!-- hub -->
    <rect x="35" y="620" width="90" height="26" rx="4" opacity=".12" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="80" y="637" text-anchor="middle" font-size="11" font-weight="700">SOLMAX</text>
  </g>

  <!-- ════ CMC ════ -->
  <g fill="#e0a030">
    <path d="M210,120 L210,180" stroke="#e0a030" stroke-width="1" fill="none" opacity=".25"/>
    <circle cx="210" cy="120" r="5" opacity=".35"/>
    <text x="222" y="123" font-size="9" font-weight="500">Netlon</text>
    <text x="290" y="123" font-size="6" fill="#584020" font-weight="400">1952</text>

    <circle cx="210" cy="180" r="5" opacity=".4"/>
    <text x="222" y="183" font-size="9" font-weight="500">Tensar Intl</text>
    <text x="320" y="183" font-size="6" fill="#584020" font-weight="400">1978</text>

    <path d="M210,240 L210,300" stroke="#e0a030" stroke-width="1" fill="none" opacity=".2"/>
    <circle cx="210" cy="240" r="7" opacity=".5"/>
    <text x="222" y="243" font-size="9" font-weight="500">Tensar Corp</text>
    <text x="330" y="243" font-size="6" fill="#584020" font-weight="400">1983</text>

    <circle cx="210" cy="300" r="4" opacity=".3"/>
    <text x="222" y="303" font-size="7">+Tensar Intl '06</text>

    <rect x="170" y="620" width="80" height="26" rx="4" opacity=".1" stroke="#e0a030" stroke-width="1.5"/>
    <text x="210" y="637" text-anchor="middle" font-size="11" font-weight="700">CMC</text>
  </g>

  <!-- ════ MACCAFERRI ════ -->
  <g fill="#30b880">
    <circle cx="340" cy="80" r="5" opacity=".35"/>
    <text x="352" y="83" font-size="9" font-weight="500">Maccaferri</text>
    <text x="440" y="83" font-size="6" fill="#204838" font-weight="400">1879</text>

    <path d="M340,400 L340,460" stroke="#30b880" stroke-width="1" fill="none" opacity=".25"/>
    <circle cx="340" cy="400" r="5" opacity=".4"/>
    <text x="352" y="403" font-size="9" font-weight="500">Synteen</text>
    <text x="420" y="403" font-size="6" fill="#204838" font-weight="400">1998</text>

    <rect x="300" y="620" width="80" height="26" rx="4" opacity=".1" stroke="#30b880" stroke-width="1.5"/>
    <text x="340" y="637" text-anchor="middle" font-size="10" font-weight="600">MACCAFERRI</text>
  </g>

  <!-- ════ THRACE ════ -->
  <g fill="#d04060">
    <circle cx="470" cy="340" r="4" opacity=".35"/>
    <text x="482" y="343" font-size="8" font-weight="400">Lumite</text>
    <text x="530" y="343" font-size="6" fill="#582038" font-weight="400">1940s</text>

    <path d="M470,440 L470,500" stroke="#d04060" stroke-width="1" fill="none" opacity=".2"/>
    <circle cx="470" cy="440" r="4" opacity=".4"/>
    <text x="482" y="443" font-size="8" font-weight="400">Thrace-LINQ</text>
    <text x="545" y="443" font-size="6" fill="#582038" font-weight="400">2007</text>

    <rect x="435" y="620" width="70" height="26" rx="4" opacity=".1" stroke="#d04060" stroke-width="1.5"/>
    <text x="470" y="637" text-anchor="middle" font-size="10" font-weight="600">THRACE</text>
  </g>

  <!-- ════ DIVIDER ════ -->
  <line x1="20" y1="665" x2="520" y2="665" stroke="#14181c" stroke-width="1"/>
  <text x="20" y="680" font-size="7" font-weight="600" fill="#3a4248" letter-spacing=".1em">INDEPENDENT MANUFACTURERS</text>

  <!-- independents -->
  <g font-size="8" fill="#68747e">
    <text x="25" y="700" font-weight="600">Carthage Mills</text>
    <text x="145" y="700" font-size="6" fill="#384048" font-weight="400">1958</text>
    <text x="195" y="700" font-weight="500">Presto</text>
    <text x="255" y="700" font-size="6" fill="#384048" font-weight="400">1982</text>
    <text x="295" y="700" font-weight="500">Layfield</text>
    <text x="365" y="700" font-size="6" fill="#384048" font-weight="400">1978</text>
    <text x="405" y="700" font-weight="500">Huesker</text>
    <text x="475" y="700" font-size="6" fill="#384048" font-weight="400">1861</text>

    <text x="25" y="718" font-weight="500">Naue</text>
    <text x="75" y="718" font-size="6" fill="#384048" font-weight="400">1952</text>
    <text x="115" y="718" font-weight="500">Belton</text>
    <text x="175" y="718" font-size="6" fill="#384048" font-weight="400">1916</text>
    <text x="215" y="718" font-weight="500">Typar</text>
    <text x="270" y="718" font-size="6" fill="#384048" font-weight="400">1970s</text>
    <text x="310" y="718" font-weight="500">Hanes Geo</text>
    <text x="390" y="718" font-size="6" fill="#384048" font-weight="400">2005</text>
    <text x="425" y="718" font-weight="500">Titan Env</text>
    <text x="495" y="718" font-size="6" fill="#384048" font-weight="400">2006</text>

    <text x="25" y="736" font-weight="500">SKAPS</text>
    <text x="80" y="736" font-size="6" fill="#384048" font-weight="400">1995</text>
    <text x="115" y="736" font-weight="500">CETCO</text>
    <text x="170" y="736" font-size="6" fill="#384048" font-weight="400">1991</text>
    <text x="210" y="736" font-weight="500">Strata</text>
    <text x="260" y="736" font-size="6" fill="#384048" font-weight="400">1992</text>
    <text x="295" y="736" font-weight="500">Winfab</text>
    <text x="350" y="736" font-size="6" fill="#384048" font-weight="400">1994</text>
    <text x="385" y="736" font-weight="500">Soleno</text>
    <text x="440" y="736" font-size="6" fill="#384048" font-weight="400">1977</text>

    <text x="25" y="754" font-weight="500">ACE Geo</text>
    <text x="90" y="754" font-size="6" fill="#384048" font-weight="400">1996</text>
    <text x="125" y="754" font-weight="500">US Fabrics</text>
    <text x="210" y="754" font-size="6" fill="#384048" font-weight="400">2000</text>
  </g>

</svg>
</div>
<div class="f">25 manufacturers · Each column = one acquisition chain</div>
</body>
</html>
